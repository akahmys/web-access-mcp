[package]
name = "mcp-web-agent"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "A high-precision MCP agent for web automation and searching"

[dependencies]
tokio = { version = "1", features = ["full"] }
chromiumoxide = "0.5"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Note: mcp-core is assumed to be available as a dependency
mcp-core = "0.1"
thiserror = "1.0"

[dev-dependencies]
# For testing
