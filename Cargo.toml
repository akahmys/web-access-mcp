[package]
name = "web-access-mcp"
version = "0.1.0"
edition = "2021"
authors = ["akahmys"]
description = "A high-precision MCP agent for web automation and searching"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
chromiumoxide = "0.9"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
futures-util = "0.3"
dashmap = "5.5"
urlencoding = "2.1"
reqwest = { version = "0.11", features = ["json"] }
html-to-markdown-rs = "3.9.0"
readabilityrs = "0.1.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
pdf-extract = "0.12.0"
ipnet = "2.12.0"
texting_robots = "0.2.2"
rust-mcp-schema = "0.10.3"
